name: Vérifier le jeu

on:
  pull_request:
  push:
    branches: ['codex/**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigateur-portrait-paysage
          path: |
            playwright-report/
            test-results/
          retention-days: 14
